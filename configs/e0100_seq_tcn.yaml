# e0100 -- the `seq` approach's own baseline (README.md: each approach gets its own
# pipeline and its own baseline; cross-approach comparison happens only through the frozen
# folds and the metric).
#
# HYPOTHESIS.  GBDT-on-engineered-features is saturated (>10 consecutive nulls, EXPERIMENTS.md
# §4) and the whole score is one number: the log-space correlation rho between prediction and
# truth (§2).  A causal network on the raw daily matrix attacks rho from a direction the
# tabular pipeline structurally cannot: it is supervised at EVERY day rather than at 25 anchors,
# and it carries no absolute-time feature, so it has none of the cut-off drift that
# anchor_drift.py measured (test cut-off = 3.92x feature-space outlier).
#
# WHAT WOULD MAKE IT A WIN.  Not necessarily beating 1.76551 solo.  corr(log e0049, log e0064)
# = 0.9989 -- AutoGluon-vs-LightGBM on the same columns is not diversity, and the blend buys
# nothing.  A sequence model that lands anywhere near the GBDT while correlating at ~0.95 is
# worth more than one that ties it at 0.999.
#
# COST.  Minutes per fold on one H200: the whole panel is 2.66 GB fp16 and stays resident, so
# there is no dataloader; a batch is a slice.
exp_id: e0100
parent_id: e0000_naive_geo3
approach: nn_seq
change: "seq baseline: causal dilated TCN (d128, 8 blocks, RF 511d) on the 13-channel raw daily panel, dense per-day supervision"
tier: screen
seed: 0

# --- architecture -------------------------------------------------------------------------
arch: tcn            # tcn | gru | xformer
d_model: 128
n_blocks: 8          # dilations 1..128 -> receptive field 511 days, covers the full history
dropout: 0.1
dow: false           # day-of-week channels: a separate experiment, not part of the baseline

# --- optimisation -------------------------------------------------------------------------
epochs: 12
batch_users: 512
lr: 0.003
weight_decay: 0.0001

notes: >
  First run of a new approach. Reported as tier=screen because the epoch count has not yet
  been calibrated against anything -- the number to read off this run is the wall-clock and
  the shape of the loss curve, not the CV. The confirm-tier run fixes epochs first.
