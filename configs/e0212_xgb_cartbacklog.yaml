  subsample: 0.8
  colsample_bytree: 0.8
  lambda: 1.0
  max_bin: 256
  tree_method: hist
  nthread: 16
  verbosity: 0

notes: "screen d_rho +0.00090 (A1) / +0.00052 (A2); the stock between cart inflow and order outflow"
