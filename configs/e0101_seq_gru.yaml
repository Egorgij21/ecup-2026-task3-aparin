# e0101 -- parent e0100, ONE change: backbone tcn -> gru.
# Motivation is diversity as much as accuracy. e0100 lands 0.0035 behind e0049 on folds 3/4,
# which is the regime where a second, differently-biased model is worth more than a marginally
# better copy: corr(log e0049, log e0064) = 0.9989 and that blend bought nothing.
# A GRU has unbounded receptive field and a multiplicative gating nonlinearity, so it should
# make different mistakes from a stack of dilated convolutions on the same input.
exp_id: e0101
parent_id: e0100
approach: nn_seq
change: "backbone tcn -> gru (2 layers, d128), everything else identical to e0100"
tier: confirm
seed: 0
arch: gru
d_model: 128
n_blocks: 2          # = GRU layers; 8 would be absurd for a recurrent stack
dropout: 0.1
dow: false
epochs: 12
batch_users: 512
lr: 0.003
weight_decay: 0.0001
notes: "diversity member; GRU is the literature default at this data scale (reports/papers_part3_sequence.md)"
