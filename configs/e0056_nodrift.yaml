# e0001 -- first GBDT. Parent is the naive geo3 baseline (e0000), scored on the identical
# folds inside the same run so the delta is an exact paired comparison.
exp_id: e0056
parent_id: e0020
approach: gbdt_direct
change: "drop lifetime/365d features -- the ones anchor_drift blamed for test-cutoff drift"
tier: confirm
seed: 0
es_gap_days: 30
fixed_rounds: 178
feature_exclude_patterns: ["_total$", "^tenure", "_365$"]

feature_blocks: [base, counts, rank, visit, channel, dispersion]
max_train_anchors: null

num_boost_round: 3000
early_stopping_rounds: 100
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "test cut-off is 3.92x further from training cut-offs than they are from each other; these features carry 65% of that drift"
