#
# WHY THIS SEARCH IS TRUSTWORTHY WHERE THE EARLIER ONE WAS NOT. src/tune_usercv.py scored each
# trial by the MINIMUM of an early-stopped validation curve; the curve is noise (per-evaluation
# sd 0.0014-0.0027), so min-of-N is biased by ~sigma*sqrt(2 ln N) and configs that train longer
