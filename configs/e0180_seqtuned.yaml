# run_seq.py trains a FIXED epoch count and scores once at the end, so no such selection exists,
# and  competed as an ordinary hyperparameter over 8..200 -- the winners chose 8..15.
#
# Against the e0101 defaults this is NARROWER (d64 vs 128), DEEPER (3 vs 2 layers) and far more
# REGULARISED (dropout 0.36 vs 0.10). Capacity was binding downward; I had only ever probed up.
