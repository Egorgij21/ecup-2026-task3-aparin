# e0001 -- first GBDT. Parent is the naive geo3 baseline (e0000), scored on the identical
# folds inside the same run so the delta is an exact paired comparison.
exp_id: e0018
parent_id: e0017
approach: gbdt_direct
change: "cap 3000 -> 30000 with a DECONTAMINATED early-stopping set (vs e0016 which lifted the cap with a contaminated one)"
tier: confirm
seed: 0
es_gap_days: 30

feature_blocks: [base, counts, rank, visit, channel]
max_train_anchors: null

num_boost_round: 30000
early_stopping_rounds: 200
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "the real test of early stopping: does it now fire at a sensible iteration?"
