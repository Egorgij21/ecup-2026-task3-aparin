# e0001 -- first GBDT. Parent is the naive geo3 baseline (e0000), scored on the identical
# folds inside the same run so the delta is an exact paired comparison.
exp_id: e0016
parent_id: e0015
approach: gbdt_direct
change: "num_boost_round 3000 -> 30000, patience 100 -> 200; let early stopping actually fire"
tier: confirm
seed: 0

feature_blocks: [base, counts, rank, visit, channel, ewm]
max_train_anchors: null

num_boost_round: 30000
early_stopping_rounds: 200
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "every prior run hit the 3000 cap (best_iteration 2996-3000) so all deltas so far are on an undertrained model"
