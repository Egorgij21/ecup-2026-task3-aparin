# e0001 -- first GBDT. Parent is the naive geo3 baseline (e0000), scored on the identical
# folds inside the same run so the delta is an exact paired comparison.
exp_id: e0071
parent_id: e0049
approach: gbdt_direct
change: "train on the most RECENT 10 anchors only (max_train_anchors=10)"
tier: confirm
seed: 0
es_gap_days: 30
fixed_rounds: 178

feature_blocks: [base, counts, rank, visit, channel, dispersion, sbcnomoment]
max_train_anchors: 10

num_boost_round: 3000
early_stopping_rounds: 100
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "my_hypothesis.txt #1 -- recent data is more representative of the test period. BACKLOG e0012 (never run). Level correction is dead (k*=0.990, mean term 0.01% of RMSLE^2), so this tests the RELATIONSHIP going stale, not the level."
