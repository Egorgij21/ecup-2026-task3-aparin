# e0191 -- tsfresh block confirm. One change vs e0049: add the `tsfresh` feature block.
# The local screen (e0189-family, tier=screen) put the 66-feature bundle at -0.00074 rho (A2)
# and +0.00019 (A1) against a +-0.001 noise control -- i.e. NIL at screen resolution, and no
# statistic family cleared the control at either anchor. This run exists because the screen is
# capacity-starved (13.5k train rows vs ~66k/fold here) and a 66-column bundle is penalised
# ~66x harder than the 1-column control on that budget, so the screen cannot separate "no
# information" from "not enough rows to use it". CLAUDE.md 4.2: screen results never decide.
# Expectation is honestly NEGATIVE -- this is a kill-confirm, not a hopeful one.
exp_id: e0191
parent_id: e0049
approach: gbdt_direct
change: "+tsfresh block: 60 hand-vectorised tsfresh statistics (c3, time-reversal, ARCH, Haar wavelet energy, level-strikes, trend t-stat, lag-1 autocorr) x {gmv,ord} x {30,90,365}"
tier: confirm
seed: 0
es_gap_days: 30
fixed_rounds: 178

feature_blocks: [base, counts, rank, visit, channel, dispersion, sbcnomoment, tsfresh]
max_train_anchors: null

num_boost_round: 3000
early_stopping_rounds: 100
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "Every statistic validated against tsfresh 0.21.2 itself (max rel err: c3 0.0, time_reversal 3e-08, longest_strike 0.0, autocorrelation 4e-08, linear_trend 2e-15). Three were WRONG before the library check -- c3 had a bispectrum formula, arch7 used a segment-wise Pearson instead of tsfresh's global-mean convention, trendt omitted the intercept. Lempel-Ziv was implemented and validated (6e-08) but is NOT emitted: 32s/250k-users/window vs 0.3s for everything else (unvectorisable per-user scan, ~2h/build) and it was the worst screen family (-0.00218 at A2). Local screen: bundle -0.00074 (A2) / +0.00019 (A1) vs +-0.001 noise control; best family tf_wavenergy2 +0.00039 (A1) flipped to -0.00003 (A2)."
