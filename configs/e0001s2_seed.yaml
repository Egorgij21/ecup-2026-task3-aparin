# e0001 -- first GBDT. Parent is the naive geo3 baseline (e0000), scored on the identical
# folds inside the same run so the delta is an exact paired comparison.
exp_id: e0001s2
parent_id: e0000_naive_geo3
approach: gbdt_direct
change: "e0001 replicate, seed 2 -- noise-floor measurement"
tier: confirm
seed: 2

feature_blocks: [base]
max_train_anchors: null

num_boost_round: 3000
early_stopping_rounds: 100
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "CLAUDE.md 3.4: sigma_noise = sd of the metric across seeds"
