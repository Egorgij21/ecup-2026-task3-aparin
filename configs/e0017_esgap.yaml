# e0001 -- first GBDT. Parent is the naive geo3 baseline (e0000), scored on the identical
# folds inside the same run so the delta is an exact paired comparison.
exp_id: e0017
parent_id: e0007
approach: gbdt_direct
change: "es_gap_days 0 -> 30: separate the early-stopping anchor from the fit anchors by a full horizon"
tier: confirm
seed: 0
es_gap_days: 30

feature_blocks: [base, counts, rank, visit, channel]
max_train_anchors: null

num_boost_round: 3000
early_stopping_rounds: 100
lgb_params:
  objective: regression
  metric: rmse
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  num_threads: 16
  verbosity: -1

notes: "e0016 showed ES never fires because the ES anchor is a near-duplicate of training rows; this decontaminates it"
